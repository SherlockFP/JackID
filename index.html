<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="JackID — a first-person PSX horror casino roguelike. Single player or with friends." />
  <title>JackID</title>
  <style>
    /* Inline critical CSS: the page must be black + BIOS green before any JS runs. */
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; background: #000; }
    #ui { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    #boot {
      position: fixed; inset: 0; z-index: 100; box-sizing: border-box; padding: 24px 32px;
      background: #000; color: #5aff7b; font: 20px/1.3 'VT323', 'Courier New', monospace;
      white-space: pre; cursor: default; user-select: none;
    }
    #boot .dim { color: #3a8a4a; }
    #boot.veil { display: flex; align-items: center; justify-content: center; text-align: center; cursor: pointer; }
    #boot .blink { animation: bootblink 1s steps(1) infinite; }
    @keyframes bootblink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0"></canvas>
  <div id="ui"></div>
  <div id="boot"><span>JackID BIOS v__APP_VERSION__</span>
<span class="dim">(C) 1997 THE HOUSE. ALL DEBTS RESERVED.</span>

MEMORY TEST ........ OK
VIDEO .............. <span id="boot-video">...</span>
<span class="blink">_</span></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
